name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.11
          cache: true
      - run: make test-runtime
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.11
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.15.1
      - run: make tools
      - run: pnpm --dir web/admin install --frozen-lockfile
      - run: make check test build
      - run: go test -race ./pkg/... ./apps/... ./services/...
      - run: make init infra-up migrate bootstrap
      - run: make test-auth test-rbac test-member
      - name: Real service smoke test
        run: |
          python3 scripts/dev.py > /tmp/goseed-dev.log 2>&1 &
          runner=$!
          trap 'kill "$runner"; wait "$runner" || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8081/readyz > /dev/null; then break; fi
            sleep 1
          done
          make smoke auth-smoke rbac-smoke member-smoke
      - name: Failure logs
        if: failure()
        run: cat /tmp/goseed-dev.log 2>/dev/null || true
      - name: Stop infrastructure
        if: always()
        run: docker compose --env-file .env -p goseed -f deploy/compose/compose.yaml down
