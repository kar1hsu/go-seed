Name: system-rpc
ListenOn: ${SYSTEM_RPC_HOST}:${SYSTEM_RPC_PORT}
Mode: dev
Timeout: 2000
Health: true
Log:
  ServiceName: system-rpc
  Mode: console
  Encoding: json
MySQL:
  Host: ${MYSQL_HOST}
  Port: ${MYSQL_PORT}
  Database: ${MYSQL_DATABASE}
  User: ${MYSQL_USER}
  Password: "${MYSQL_PASSWORD}"
Cache:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Type: node
  NonBlock: true

Tokens:
  Secret: "${ADMIN_TOKEN_SECRET}"
  Issuer: go-seed-admin
  Audience: go-seed-admin-api
  AccessTTL: 15m
RefreshTTL: 168h
AdminAPISecret: "${ADMIN_RPC_SECRET}"

Storage:
  Driver: ${STORAGE_DRIVER}
  Root: ${STORAGE_ROOT}
  Endpoint: "${S3_ENDPOINT}"
  Bucket: "${S3_BUCKET}"
  AccessKey: "${S3_ACCESS_KEY}"
  SecretKey: "${S3_SECRET_KEY}"
  Secure: ${S3_SECURE}
  Region: "${S3_REGION}"
MethodTimeouts:
  - FullMethod: /goseed.system.v1.System/CompleteFileUpload
    Timeout: 30s
