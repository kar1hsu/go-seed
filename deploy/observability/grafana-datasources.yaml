apiVersion: 1
datasources:
  - name: Loki
    uid: goseed-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: Trace
          matcherRegex: '"trace":"(\w+)"'
          datasourceUid: goseed-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View Trace
  - name: Tempo
    uid: goseed-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: goseed-loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        customQuery: true
        query: '{compose_project="goseed"} |= "$${__span.traceId}"'
